# Настройки Luma-мода. Файл лежит в памяти книги: папка luma/luma.ini.
# После правки перезапусти читалку (выключи и включи) — настройки читаются при старте программы.
# Строка, начинающаяся с #, — комментарий. Чтобы вернуть как было, закомментируй строку.
# Если что-то сломалось: создай в папке luma пустой файл с именем disable — мод отключится.

[general]
# 1 = писать журнал в luma/luma.log (полезно, если что-то не так), 2 = подробно
debug = 1

[text]
# 1 = шрифт, размер, интервал и поля одни на все книги: поменял в одной — так во всех
global = 1
# 1 = после смены размера, интервала, полей, шрифта, поворота открывать страницу с тем же текстом,
#     с которого начиналась страница, куда ты перелистнул (а не тот же номер страницы)
keep_place = 1

# Что подставлять вместо трёх штатных интервалов (1.0 / 1.5 / 2.0 в меню)
line_spacing = 1.15, 1.3, 1.5

# Свои 6 значений полей в пикселях вместо 22, 26, 30, 34, 46, 60
margins = 8, 14, 20, 26, 34, 46

# Множитель размера шрифта поверх штатных ступеней (1.0 = как есть, 1.05 = на 5% крупнее)
size = 1.0

# Красная строка (em = ширина буквы «М»), отступ между абзацами, выравнивание
#indent = 1.5em
#paragraph_spacing = 0.3em
#align = justify

# Дополнительные поля слева/справа поверх полей программы
#side_margin = 0.5em

# 1 = весь текст жирным начертанием (контрастнее на e-ink)
bold = 0

# 1 = перебивать стили самой книги (интервал, шрифт, отступы), 0 = уважать их
override_book_styles = 1

[fonts]
# Замена шрифтов из меню на свои. Слева — имя файла встроенного шрифта,
# справа — «как назвать в меню | путь без -Regular.ttf».
# Рядом могут лежать -Italic, -Bold, -BoldItalic — тогда курсив и жирный будут настоящие.
# Свои шрифты кладите в папку luma/fonts (путь /userdata/luma/fonts/...).
# Слоты без кириллицы, их не жалко: Ebrima, Montserrat-Light, Cour,
# OpenDyslexic, OpenDyslexicAlta, OpenDyslexicMono, Malgun
Ebrima = PT Serif | /opt/luma/fonts/PTSerif
Cour = Literata | /opt/luma/fonts/Literata
OpenDyslexic = Tenor Sans | /opt/luma/fonts/TenorSans
Montserrat-Light = Montserrat | /opt/luma/fonts/Montserrat
# свободны ещё: OpenDyslexicAlta, OpenDyslexicMono, Malgun

[light]
# mode = mix: верхний/нижний ползунок работают как «яркость» и «температура».
#   Ползунок яркости (brightness_slider = warm или cold) задаёт общую яркость по кривой brightness,
#   второй — какую долю этой яркости отдать его цвету (0 = вся в цвет ползунка яркости, 10 = вся в его).
#   Белый добавляется вместо части тёплого, поэтому ярче не становится.
# mode = separate: как штатно, два независимых ползунка с кривыми cold и warm.
mode = mix
brightness_slider = cold
brightness = 1, 2, 3, 5, 8, 12, 18, 27, 40, 60
# Точный режим: кривая в тактах ШИМ при своём периоде (мод пишет регистры напрямую, драйвер не трогает).
# Драйвер светодиодов растягивает короткий импульс, поэтому минимум зависит от частоты:
# при 4 кГц (pwm_period = 23440) 2 такта заметно тусклее штатного минимума, реже 4 кГц уже не тусклее.
# Позиции 1..10 по экспоненте до заводского максимума (40/255 ≈ 3677 тактов из 23440).
# Позиция 1 = 2 такта: на ней у температуры три положения (2+0, 1+1, 0+2), дальше больше.
# Убрать строку brightness_ticks — работает обычная кривая brightness.
brightness_ticks = 2, 5, 11, 24, 56, 130, 300, 692, 1596, 3677
# Температура — целыми тактами, ползунок задаёт долю света (0, 10 … 100%) с учётом растяжки импульса:
# канал с d тактами светит как d + pulse_floor. Края скачут — увеличь, середина скачет — уменьши.
pulse_floor = 6
pwm_period = 23440
# Значение подсветки (0..255) для позиций ползунка 1..10 в режиме separate. Штатно: 4 8 12 … 40.
cold = 1, 2, 3, 5, 8, 12, 17, 23, 31, 40
warm = 1, 2, 3, 5, 8, 12, 17, 23, 31, 40

[library]
# 1 = миниатюры обложек в меню мод рисует сам из обложки в книге (штатные бывают обрезаны)
thumbnails = 1
# 1 = сортировка «Название» — по настоящему названию, «Автор» — по фамилии из книги
#     (один автор — одна строка), внутри автора книги по серии и номеру
sort = 1
# Показывать в библиотеке автора и название из книги вместо имени файла
show_titles = 1
# Шаблон: {author} {title} {series} {num} {file}.
# Кусок в [квадратных скобках] пропадает, если в нём что-то пустое (например, книга не из серии).
title_format = {author} — [({series}[ {num}]) ]{title}
# last_initials = Фамилия И. О., full = Имя Отчество Фамилия, last = только фамилия, initials = И. Фамилия
author_style = last_initials
# Строка списка подбирается по настоящей ширине шрифта: целиком → с одной фамилией →
# «Фамилия/(Серия N) Назв» → «Фамилия/(N) Назв». Порядок всегда «автор, серия, название».
# max_len — запасная подпись (символов), пока ширина строки ещё не известна. 0 = не обрезать.
max_len = 34
# Обрезка отдельных полей (0 = не обрезать), если max_len = 0.
max_author = 0
max_title = 0
max_series = 0
# Заголовок вверху в читалке (вместо обрезанного имени файла) и его длина.
reader_format = {title}
max_reader = 30
# Плитки на главном экране (уже tile_width px): начало названия (не меньше половины) + фамилия.
tile_width = 300

[sleep]
# 1 = на экране сна обложка открытой книги, под ней автор, название и серия.
# Если в «Изображениях» выбрана своя заставка, мод её не трогает.
cover = 1

[buttons]
# 1 = верхние боковые кнопки листают вперёд, нижние назад (штатно наоборот)
swap = 1
# 1 = зажать две любые кнопки разом на 3 секунды — переключить раскладку (запоминается до следующего раза)
toggle = 1

[interface]
# В меню «Интервалы между строк» показывать настоящие значения.
menu_values = 1
# Процент заряда рядом с часами («+» — заряжается).
battery_percent = 1
# Процент прочитанного рядом с номером страницы.
progress_percent = 1

